spring.application.name=sms

#Server Configuration
server.port=8001

# datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3308/sms?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=passcode
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate and JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Documentation configuration
springdoc.api-docs.enabled=true
